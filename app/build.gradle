apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'stringfog'

// Native string fog only (DEX).
// fogPackages must stay on the host package.
stringfog {
    // AES-128-ECB via buildSrc: harder to reverse than XOR. Each string gets its
    // own random key injected by the plugin, so ECB block-reuse is not a concern.
    implementation 'com.kFjQzLm.fog.StringFogAesImpl'
    packageName "com.kFjQzLm.VpRnTx"
    enable true
    fogPackages = ["com.kFjQzLm.VpRnTx"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

// Release signing: keystore.properties (локально, в .gitignore). В CI файл создаётся
// из GitHub Secrets. Без файла release подписывается debug-ключом.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kFjQzLm.VpRnTx"
    defaultConfig {
        applicationId "com.Labfaxo2.Butwum"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['MYAPP_RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['MYAPP_RELEASE_STORE_FILE'])
                storePassword keystoreProperties['MYAPP_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['MYAPP_RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['MYAPP_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            // Removes resources that no longer have any code references (dead demo
            // screens from the template leave orphan drawables behind otherwise).
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    aaptOptions {
        cruncherEnabled true
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
            ]
        }
    }
}

dependencies {
    // Compose UI
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // WebKit dependency for Payment Request API
    implementation 'androidx.webkit:webkit:1.14.0'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:34.10.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-perf"
    implementation "com.google.firebase:firebase-crashlytics"

    // Google Play Services: Advertising ID, App Set ID, Play Integrity, Install Referrer
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.play:integrity:1.4.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // App Links resolver (kept from the original WebView host)
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'

    // StringFog runtime (Base64 used by generated StringFog classes)
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'

    testImplementation 'junit:junit:4.13.2'
}
